<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CookIt - Seu Livro de Receitas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f7f9fc; color: #333; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1 { color: #ff6b6b; text-align: center; margin-bottom: 20px; font-size: 2rem; }
    form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
    input, textarea { padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; width: 100%; }
    button { background-color: #ff6b6b; color: white; border: none; padding: 12px; font-size: 1rem; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: bold; }
    button:hover { background-color: #ee5253; }
    .recipe-card { background: #fff8f8; border-left: 5px solid #ff6b6b; padding: 15px; margin-bottom: 15px; border-radius: 6px; position: relative; }
    .recipe-card h3 { color: #2d3436; margin-bottom: 5px; }
    .recipe-card p { font-size: 0.9rem; color: #636e72; margin-bottom: 4px; }
    .delete-btn { position: absolute; top: 12px; right: 12px; background: #d63031; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🍳 CookIt</h1>
    
    <!-- Formulário para cadastrar receitas -->
    <form id="recipeForm">
      <input type="text" id="title" placeholder="Nome da Receita (ex: Bolo de Cenoura)" required>
      <input type="text" id="ingredients" placeholder="Ingredientes (separados por vírgula)" required>
      <input type="text" id="prepTime" placeholder="Tempo de preparo (ex: 45 min)" required>
      <textarea id="instructions" placeholder="Modo de preparo" rows="3" required></textarea>
      <button type="submit">Adicionar Receita</button>
    </form>

    <h2>Minhas Receitas</h2>
    <div id="recipeList" style="margin-top: 15px;"></div>
  </div>

  <script>
    const recipeForm = document.getElementById('recipeForm');
    const recipeList = document.getElementById('recipeList');

    // Carregar receitas salvas do LocalStorage
    let recipes = JSON.parse(localStorage.getItem('cookit_recipes')) || [];

    function displayRecipes() {
      recipeList.innerHTML = '';
      if (recipes.length === 0) {
        recipeList.innerHTML = '<p style="color: #888;">Nenhuma receita cadastrada ainda.</p>';
        return;
      }

      recipes.forEach((recipe, index) => {
        const card = document.createElement('div');
        card.className = 'recipe-card';
        card.innerHTML = `
          <h3>${recipe.title}</h3>
          <p><strong>⏱ Tempo:</strong> ${recipe.prepTime}</p>
          <p><strong>🛒 Ingredientes:</strong> ${recipe.ingredients}</p>
          <p><strong>👨‍🍳 Modo de preparo:</strong> ${recipe.instructions}</p>
          <button class="delete-btn" onclick="removeRecipe(${index})">Excluir</button>
        `;
        recipeList.appendChild(card);
      });
    }

    recipeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const newRecipe = {
        title: document.getElementById('title').value,
        ingredients: document.getElementById('ingredients').value,
        prepTime: document.getElementById('prepTime').value,
        instructions: document.getElementById('instructions').value
      };

      recipes.push(newRecipe);
      localStorage.setItem('cookit_recipes', JSON.stringify(recipes));
      recipeForm.reset();
      displayRecipes();
    });

    function removeRecipe(index) {
      recipes.splice(index, 1);
      localStorage.setItem('cookit_recipes', JSON.stringify(recipes));
      displayRecipes();
    }

    // Inicializar exibição
    displayRecipes();
  </script>
</body>
</html>
